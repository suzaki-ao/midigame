<!DOCTYPE html>
<html lang="ja">
<head>
      <link rel="icon" type="image/png" href="mimd.png">
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>MIDIを音ゲーに変換</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;

  width:100%;
  min-height:100%;

  background:#08080c;
  color:#fff;

  font-family:
    Arial,
    "Noto Sans JP",
    sans-serif;

  overscroll-behavior:none;
}

body{
  text-align:center;

  overflow-x:hidden;
}


/* =====================================================
   HEADER
===================================================== */

header{

  padding:10px;

}

h1{

  margin:5px 0 10px;

  font-size:
    clamp(18px,3vw,28px);

}


/* =====================================================
   CONTROL
===================================================== */

.controls{

  width:
    min(95vw,900px);

  margin:auto;

  display:flex;

  flex-wrap:wrap;

  align-items:center;

  justify-content:center;

  gap:6px;

}

.controls button,
.controls select{

  min-height:40px;

  padding:
    8px 14px;

  border:0;

  border-radius:8px;

  background:#373841;

  color:#fff;

  font-size:14px;

  font-weight:bold;

}

.controls button{

  cursor:pointer;

}

.controls button:active{

  transform:scale(.96);

}

.controls button:disabled{

  opacity:.4;

}


/* =====================================================
   SCORE
===================================================== */

#scoreBoard{

  width:
    min(95vw,900px);

  margin:
    8px auto;

  padding:9px;

  background:#17171d;

  border:
    1px solid #3d3d45;

  border-radius:9px;

}

.scoreRow{

  display:flex;

  justify-content:
    space-around;

  gap:10px;

  font-size:
    clamp(12px,2vw,17px);

}

.scoreItem{

  flex:1;

}

.scoreItem b{

  margin-left:4px;

}

.smallStats{

  margin-top:6px;

  color:#aaa;

  font-size:
    clamp(10px,1.7vw,14px);

}


/* =====================================================
   GAME WRAPPER

   ★ 大型化
===================================================== */

#game-area{

  width:100%;

  display:flex;

  justify-content:center;

  align-items:center;

}


/*
  PCでは最大720×900。

  画面が小さければ自動縮小。
*/

#game-container{

  position:relative;

  width:
    min(
      720px,
      calc(100vw - 20px)
    );

  /*
    900pxを基本サイズにしつつ
    画面高さにも適応
  */

  height:
    min(
      900px,
      calc(100vh - 300px)
    );

  min-height:500px;

  overflow:hidden;

  background:#020204;

  border:
    2px solid #555;

  border-radius:8px;

  touch-action:none;

  user-select:none;

  -webkit-user-select:none;
}


/* =====================================================
   CANVAS
===================================================== */

canvas{

  position:absolute;

  left:0;
  top:0;

  width:100%;
  height:100%;

  display:block;

  touch-action:none;

}


/* =====================================================
   JUDGEMENT
===================================================== */

#judgement{

  position:absolute;

  left:50%;
  top:40%;

  transform:
    translate(-50%,-50%);

  z-index:20;

  font-size:
    clamp(30px,7vw,58px);

  font-weight:900;

  opacity:0;

  pointer-events:none;

  white-space:nowrap;

  text-shadow:
    0 0 8px currentColor,
    0 0 25px currentColor;

}

#judgement.show{

  animation:
    judgement .42s ease-out;

}

@keyframes judgement{

  0%{

    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(.5);

  }

  20%{

    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1.15);

  }

  65%{

    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1);

  }

  100%{

    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(1.04);

  }

}


/* =====================================================
   COMBO
===================================================== */

#comboDisplay{

  position:absolute;

  left:50%;
  top:48%;

  transform:
    translate(-50%,-50%);

  z-index:19;

  font-size:
    clamp(18px,4vw,30px);

  font-weight:bold;

  opacity:0;

  pointer-events:none;

}

#comboDisplay.show{

  animation:
    combo .3s ease-out;

}

@keyframes combo{

  0%{

    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(.8);

  }

  30%{

    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1.1);

  }

  100%{

    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1);

  }

}


/* =====================================================
   COUNTDOWN
===================================================== */

#countdown{

  position:absolute;

  left:50%;
  top:35%;

  transform:
    translate(-50%,-50%);

  z-index:30;

  font-size:
    clamp(60px,14vw,120px);

  font-weight:900;

  opacity:0;

  pointer-events:none;

}

#countdown.show{

  animation:
    countdown .8s ease-out;

}

@keyframes countdown{

  0%{

    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(.3);

  }

  25%{

    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1.2);

  }

  70%{

    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1);

  }

  100%{

    opacity:0;

  }

}


/* =====================================================
   FULL COMBO
===================================================== */

#fullComboEffect{

  position:absolute;

  inset:0;

  z-index:50;

  display:none;

  align-items:center;

  justify-content:center;

  flex-direction:column;

  pointer-events:none;

  background:
    radial-gradient(
      circle at center,
      rgba(255,230,0,.28),
      rgba(0,0,0,.85) 70%
    );

}

#fullComboEffect.show{

  display:flex;

  animation:
    fcBackground 3.2s ease-out forwards;

}

.fcTitle{

  max-width:95%;

  font-size:
    clamp(32px,7vw,68px);

  font-weight:1000;

  letter-spacing:2px;

  color:#ffe600;

  text-shadow:
    0 0 8px #fff,
    0 0 20px #ffe600,
    0 0 50px #ff9d00;

  animation:
    fcTitle 3.2s ease-out forwards;

}

.fcSub{

  margin-top:10px;

  font-size:
    clamp(16px,3vw,28px);

  font-weight:bold;

  color:#fff;

  text-shadow:
    0 0 10px #fff,
    0 0 25px #ffe600;

  animation:
    fcSub 3.2s ease-out forwards;

}

@keyframes fcBackground{

  0%{opacity:0;}

  12%{opacity:1;}

  70%{opacity:1;}

  100%{opacity:0;}

}

@keyframes fcTitle{

  0%{

    opacity:0;

    transform:
      scale(.25)
      rotate(-5deg);

  }

  18%{

    opacity:1;

    transform:
      scale(1.18)
      rotate(2deg);

  }

  30%{

    transform:
      scale(.95)
      rotate(0);

  }

  45%{

    transform:
      scale(1);

  }

  100%{

    opacity:0;

    transform:
      scale(1.12);

  }

}

@keyframes fcSub{

  0%{

    opacity:0;

    transform:
      translateY(25px);

  }

  25%{

    opacity:0;

  }

  40%{

    opacity:1;

    transform:
      translateY(0);

  }

  75%{

    opacity:1;

  }

  100%{

    opacity:0;

  }

}


/* =====================================================
   10 KEYS

   ゲーム画面と同じ最大幅
===================================================== */

#laneButtons{

  width:
    min(
      720px,
      calc(100vw - 20px)
    );

  margin:
    6px auto;

  display:flex;

  gap:2px;

  touch-action:none;

}

.laneButton{

  flex:1;

  min-width:0;

  height:
    clamp(48px,8vw,70px);

  display:flex;

  align-items:center;

  justify-content:center;

  background:#202024;

  border:
    1px solid #555;

  color:#bbb;

  font-size:
    clamp(13px,2.8vw,21px);

  font-weight:bold;

  border-radius:4px;

  user-select:none;

  -webkit-user-select:none;

  touch-action:none;

  transition:
    background .05s,
    transform .05s,
    box-shadow .05s;

}

.laneButton.active{

  background:#00cfff;

  color:#fff;

  transform:
    scale(.93);

  box-shadow:
    0 0 12px #00d9ff,
    0 0 30px #00d9ff;

}

.laneButton.perfect{

  background:#fff;

  color:#111;

  box-shadow:
    0 0 15px #fff,
    0 0 40px #ffe600;

}


/* =====================================================
   RESULT
===================================================== */

#result{

  min-height:30px;

  margin:8px;

  font-size:
    clamp(16px,3vw,23px);

  font-weight:bold;

}

#info{

  color:#777;

  font-size:12px;

  padding-bottom:10px;

}


/* =====================================================
   横画面スマホ・タブレット
===================================================== */

@media
(orientation:landscape)
and
(max-height:700px){

  header{

    padding:4px;

  }

  h1{

    display:none;

  }

  #scoreBoard{

    margin:3px auto;

    padding:4px;

  }

  #game-container{

    height:
      calc(100vh - 125px);

    min-height:400px;

    width:
      min(
        720px,
        calc(100vw - 150px)
      );

  }

  #laneButtons{

    width:
      min(
        720px,
        calc(100vw - 150px)
      );

  }

  .laneButton{

    height:45px;

  }

}


/* =====================================================
   縦画面スマホ
===================================================== */

@media
(max-width:600px)
and
(orientation:portrait){

  header{

    padding:4px;

  }

  h1{

    margin:3px 0 5px;

    font-size:18px;

  }

  .controls{

    gap:3px;

  }

  .controls button,
  .controls select{

    min-height:35px;

    padding:
      6px 8px;

    font-size:12px;

  }

  #scoreBoard{

    margin:4px auto;

    padding:6px;

  }

  #game-container{

    width:
      calc(100vw - 10px);

    /*
      スマホでは画面を
      できるだけ大きく使用
    */

    height:
      min(
        680px,
        calc(100vh - 230px)
      );

    min-height:420px;

    border-radius:4px;

  }

  #laneButtons{

    width:
      calc(100vw - 10px);

  }

  .laneButton{

    height:52px;

  }

}


/* =====================================================
   極端に小さい端末
===================================================== */

@media
(max-height:600px)
and
(orientation:portrait){

  #game-container{

    height:
      calc(100vh - 205px);

    min-height:350px;

  }

  .laneButton{

    height:42px;

  }

}


/* =====================================================
   iOS / タッチ端末対策
===================================================== */

button,
.laneButton{

  -webkit-touch-callout:none;

}


/* =====================================================
   ファイル入力
===================================================== */

input[type=file]{

  max-width:
    90vw;

  font-size:12px;

}

</style>
</head>


<body>


<header>

<h1>
🎹 MIDI → 10レーン音ゲー
</h1>


<div class="controls">

<input
  type="file"
  id="midiFile"
  accept=".mid,.midi">


<select id="difficulty">

<option value="low">
低
</option>

<option
  value="mid"
  selected>
中
</option>

<option value="high">
高
</option>

</select>


<button
  id="startBtn"
  disabled>

▶ ゲーム開始

</button>


<button
  id="autoBtn">

AUTO PLAY：OFF

</button>

</div>

</header>


<div id="scoreBoard">

<div class="scoreRow">

<div class="scoreItem">

SCORE
<b id="score">0</b>

</div>


<div class="scoreItem">

COMBO
<b id="combo">0</b>

</div>


<div class="scoreItem">

MAX
<b id="maxCombo">0</b>

</div>

</div>


<div class="smallStats">

PERFECT
<b id="perfect">0</b>

　

GREAT
<b id="great">0</b>

　

GOOD
<b id="good">0</b>

　

MISS
<b id="miss">0</b>

</div>

</div>


<div id="game-area">

<div id="game-container">

<canvas
  id="gameCanvas">
</canvas>


<div id="judgement"></div>

<div id="comboDisplay"></div>

<div id="countdown"></div>


<div id="fullComboEffect">

<div class="fcTitle">
FULL COMBO
</div>

<div class="fcSub">
NO MISS
</div>

</div>

</div>

</div>


<div id="laneButtons">

<div
  class="laneButton"
  data-lane="0">
1
</div>

<div
  class="laneButton"
  data-lane="1">
2
</div>

<div
  class="laneButton"
  data-lane="2">
3
</div>

<div
  class="laneButton"
  data-lane="3">
4
</div>

<div
  class="laneButton"
  data-lane="4">
5
</div>

<div
  class="laneButton"
  data-lane="5">
6
</div>

<div
  class="laneButton"
  data-lane="6">
7
</div>

<div
  class="laneButton"
  data-lane="7">
8
</div>

<div
  class="laneButton"
  data-lane="8">
9
</div>

<div
  class="laneButton"
  data-lane="9">
0
</div>

</div>


<div id="info">

PC：1～0キー　
スマホ・タブレット：画面下のキーをタップ

</div>


<div id="result"></div>


<script
src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.39/Tone.min.js">
</script>

<script
src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.min.js">
</script>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
document.getElementById(
  "gameCanvas"
);

const ctx =
canvas.getContext("2d");


/* =====================================================
   10レーン
===================================================== */

const LANES=10;


/* =====================================================
   論理サイズ

   実際の画面サイズとは
   独立してゲームを動かす。
===================================================== */

let W=720;

let H=900;


/* =====================================================
   判定ライン
===================================================== */

let hitLineY=800;


/* =====================================================
   ノーツ
===================================================== */

const SPAWN_Y=-80;

const APPROACH_TIME=3;

let travelDistance=880;

let noteSpeed=
travelDistance/
APPROACH_TIME;

const NOTE_HEIGHT=32;


/* =====================================================
   判定
===================================================== */

const PERFECT_WINDOW=.075;

const GREAT_WINDOW=.15;

const GOOD_WINDOW=.24;


/* =====================================================
   状態
===================================================== */

let midiData=null;

let notes=[];

let effects=[];

let playing=false;

let countingDown=false;

let autoPlay=false;

let gameClockStart=0;

let songEndTime=0;


/* =====================================================
   スコア
===================================================== */

let score=0;

let combo=0;

let maxCombo=0;

let perfectCount=0;

let greatCount=0;

let goodCount=0;

let missCount=0;


/* =====================================================
   難易度
===================================================== */

const difficultySettings={

  low:{
    density:.45,
    minInterval:.18
  },

  mid:{
    density:.70,
    minInterval:.08
  },

  high:{
    density:1,
    minInterval:0
  }

};


/* =====================================================
   Canvas DPI対応

   高DPIスマホでもぼやけにくくする。
===================================================== */

function resizeCanvas(){

  const rect =
    canvas.getBoundingClientRect();

  const dpr =
    Math.min(
      window.devicePixelRatio||1,
      2
    );


  canvas.width=
    Math.floor(
      rect.width*dpr
    );

  canvas.height=
    Math.floor(
      rect.height*dpr
    );


  /*
    論理座標720×900
  */

  ctx.setTransform(

    canvas.width/W,
    0,
    0,
    canvas.height/H,
    0,
    0

  );


  drawBackground();

  drawHitLine();

}


window.addEventListener(
  "resize",
  resizeCanvas
);

window.addEventListener(
  "orientationchange",
  ()=>{
    setTimeout(
      resizeCanvas,
      150
    );
  }
);


/* =====================================================
   ピアノ
===================================================== */

const piano=
new Tone.Sampler({

  urls:{

    "A0":"A0.mp3",

    "C1":"C1.mp3",
    "D#1":"Ds1.mp3",
    "F#1":"Fs1.mp3",
    "A1":"A1.mp3",

    "C2":"C2.mp3",
    "D#2":"Ds2.mp3",
    "F#2":"Fs2.mp3",
    "A2":"A2.mp3",

    "C3":"C3.mp3",
    "D#3":"Ds3.mp3",
    "F#3":"Fs3.mp3",
    "A3":"A3.mp3",

    "C4":"C4.mp3",
    "D#4":"Ds4.mp3",
    "F#4":"Fs4.mp3",
    "A4":"A4.mp3",

    "C5":"C5.mp3",
    "D#5":"Ds5.mp3",
    "F#5":"Fs5.mp3",
    "A5":"A5.mp3",

    "C6":"C6.mp3",
    "D#6":"Ds6.mp3",
    "F#6":"Fs6.mp3",
    "A6":"A6.mp3",

    "C7":"C7.mp3",
    "D#7":"Ds7.mp3",
    "F#7":"Fs7.mp3",
    "A7":"A7.mp3",

    "C8":"C8.mp3"

  },

  release:1.8,

  baseUrl:
    "https://tonejs.github.io/audio/salamander/"

}).toDestination();


/* =====================================================
   MIDI読み込み
===================================================== */

document
.getElementById("midiFile")
.addEventListener(
"change",
async e=>{

  const file=e.target.files[0];

  if(!file)
    return;


  try{

    const buffer=
      await file.arrayBuffer();


    midiData=
      new Midi(buffer);


    const rawNotes=[];


    midiData.tracks.forEach(
      track=>{

        track.notes.forEach(
          n=>{

            rawNotes.push({

              midi:n.midi,

              time:n.time,

              duration:n.duration,

              velocity:
                n.velocity??.8

            });

          }
        );

      }
    );


    rawNotes.sort(
      (a,b)=>
        a.time-b.time
    );


    if(
      rawNotes.length===0
    ){

      document
      .getElementById(
        "startBtn"
      )
      .disabled=true;

      return;

    }


    const difficulty=
      document
      .getElementById(
        "difficulty"
      )
      .value;


    const setting=
      difficultySettings[
        difficulty
      ];


    notes=[];


    let lastAccepted=
      -Infinity;


    rawNotes.forEach(
      n=>{

        let accept=true;


        if(
          difficulty!=="high"
        ){

          if(
            n.time-
            lastAccepted
            <
            setting.minInterval
          ){

            /*
              同時押しは残す
            */

            const sameTime=
              rawNotes.some(
                x=>
                  x!==n &&
                  Math.abs(
                    x.time-
                    n.time
                  )<.01
              );


            if(!sameTime){

              accept=false;

            }

          }


          if(
            accept &&
            Math.random()>
            setting.density
          ){

            accept=false;

          }

        }


        if(!accept)
          return;


        lastAccepted=n.time;


        notes.push({

          midi:n.midi,

          lane:
            (
              n.midi%LANES+
              LANES
            )%LANES,

          midiTime:n.time,

          duration:n.duration,

          velocity:n.velocity,

          judged:false,

          y:SPAWN_Y

        });

      }
    );


    if(
      notes.length===0
    ){

      document
      .getElementById(
        "result"
      )
      .textContent=
        "この難易度ではノーツがありません";

      return;

    }


    const firstTime=
      notes[0].midiTime;


    /*
      ★ 最初のノーツは
        必ず3秒後に判定
    */

    notes=
      notes.map(
        n=>({

          ...n,

          time:
            APPROACH_TIME+
            (
              n.midiTime-
              firstTime
            ),

          y:SPAWN_Y,

          judged:false

        })
      );


    songEndTime=0;


    notes.forEach(
      n=>{

        songEndTime=
          Math.max(
            songEndTime,
            n.time+n.duration
          );

      }
    );


    document
    .getElementById(
      "startBtn"
    )
    .disabled=false;


    document
    .getElementById(
      "result"
    )
    .textContent=
      `${notes.length}ノーツ読み込み完了`;

  }
  catch(error){

    console.error(error);

    document
    .getElementById(
      "result"
    )
    .textContent=
      "MIDI読み込みエラー";

  }

});


/* =====================================================
   AUTO
===================================================== */

document
.getElementById("autoBtn")
.addEventListener(
"click",
function(){

  autoPlay=!autoPlay;


  this.textContent=
    autoPlay
    ?"AUTO PLAY：ON"
    :"AUTO PLAY：OFF";


  this.style.background=
    autoPlay
    ?" #008fba"
    :"";


});


/* =====================================================
   START
===================================================== */

document
.getElementById("startBtn")
.addEventListener(
"click",
async function(){

  if(
    playing||
    countingDown||
    !midiData||
    notes.length===0
  ){

    return;

  }


  await Tone.start();


  stopMusic();


  resetGame();


  notes.forEach(
    note=>{

      note.judged=false;

      note.y=SPAWN_Y;

    }
  );


  effects=[];


  document
  .getElementById(
    "fullComboEffect"
  )
  .classList.remove(
    "show"
  );


  playing=true;

  countingDown=true;

  this.disabled=true;


  await runCountdown();


  if(!playing){

    this.disabled=false;

    return;

  }


  gameClockStart=
    performance.now();


  countingDown=false;


  startMusic();


  requestAnimationFrame(
    gameLoop
  );

});


/* =====================================================
   COUNTDOWN
===================================================== */

function runCountdown(){

  return new Promise(
    resolve=>{

      const el=
        document.getElementById(
          "countdown"
        );


      let n=3;


      function step(){

        if(!playing){

          el.textContent="";

          el.className="";

          resolve();

          return;

        }


        if(n>0){

          el.textContent=n;

          el.className="";

          void el.offsetWidth;

          el.classList.add(
            "show"
          );


          n--;

          setTimeout(
            step,
            1000
          );

          return;

        }


        el.textContent="GO!";

        el.className="";

        void el.offsetWidth;

        el.classList.add(
          "show"
        );


        setTimeout(
          ()=>{

            el.textContent="";

            el.className="";

            resolve();

          },
          500
        );

      }


      step();

    }
  );

}


/* =====================================================
   MUSIC
===================================================== */

function startMusic(){

  Tone.Transport.stop();

  Tone.Transport.cancel();

  Tone.Transport.position=0;


  const firstTime=
    notes[0].midiTime;


  midiData.tracks.forEach(
    track=>{

      track.notes.forEach(
        n=>{

          const t=
            APPROACH_TIME+
            (
              n.time-
              firstTime
            );


          Tone.Transport.schedule(
            time=>{

              piano.triggerAttackRelease(

                Tone.Frequency(
                  n.midi,
                  "midi"
                ),

                Math.max(
                  .03,
                  n.duration
                ),

                time,

                Math.max(
                  .05,
                  Math.min(
                    1,
                    n.velocity??.8
                  )
                )

              );

            },

            Math.max(
              0,
              t
            )

          );

        }
      );

    }
  );


  Tone.Transport.start();

}


/* =====================================================
   STOP
===================================================== */

function stopMusic(){

  try{

    Tone.Transport.stop();

    Tone.Transport.cancel();

    Tone.Transport.position=0;

  }
  catch(e){}

}


/* =====================================================
   RESET
===================================================== */

function resetGame(){

  score=0;

  combo=0;

  maxCombo=0;

  perfectCount=0;

  greatCount=0;

  goodCount=0;

  missCount=0;

  effects=[];

  updateScore();

}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(timestamp){

  if(
    !playing||
    countingDown
  ){

    return;

  }


  const elapsed=
    (
      timestamp-
      gameClockStart
    )/1000;


  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  drawBackground();

  drawHitLine();


  for(
    const note of notes
  ){

    if(note.judged)
      continue;


    const spawnTime=
      note.time-
      APPROACH_TIME;


    /*
      ★ 出現前は絶対描画しない
    */

    if(
      elapsed<
      spawnTime
    ){

      continue;

    }


    const progress=
      (
        elapsed-
        spawnTime
      )/
      APPROACH_TIME;


    note.y=
      SPAWN_Y+
      progress*
      travelDistance;


    drawNote(note);


    /*
      AUTO
    */

    if(
      autoPlay &&
      elapsed>=note.time &&
      !note.judged
    ){

      judgeNote(
        note,
        "PERFECT"
      );

    }


    /*
      MISS
    */

    if(
      !autoPlay &&
      elapsed>
      note.time+
      GOOD_WINDOW &&
      !note.judged
    ){

      judgeNote(
        note,
        "MISS"
      );

    }

  }


  updateAndDrawEffects();


  if(
    elapsed>
    songEndTime+
    1
  ){

    finishGame();

    return;

  }


  requestAnimationFrame(
    gameLoop
  );

}


/* =====================================================
   BACKGROUND
===================================================== */

function drawBackground(){

  ctx.fillStyle="#020204";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  const laneWidth=
    W/LANES;


  for(
    let i=1;
    i<LANES;
    i++
  ){

    const x=
      i*laneWidth;


    ctx.strokeStyle="#29292e";

    ctx.lineWidth=2;


    ctx.beginPath();

    ctx.moveTo(
      x,
      0
    );

    ctx.lineTo(
      x,
      H
    );

    ctx.stroke();

  }


  ctx.fillStyle=
    "rgba(255,255,255,.025)";


  ctx.fillRect(
    0,
    hitLineY-40,
    W,
    80
  );

}


/* =====================================================
   HIT LINE
===================================================== */

function drawHitLine(){

  ctx.strokeStyle="#ff4050";

  ctx.lineWidth=5;


  ctx.beginPath();

  ctx.moveTo(
    0,
    hitLineY
  );

  ctx.lineTo(
    W,
    hitLineY
  );

  ctx.stroke();

}


/* =====================================================
   NOTE
===================================================== */

function drawNote(note){

  const laneWidth=
    W/LANES;


  const x=
    note.lane*
    laneWidth+
    4;


  const width=
    laneWidth-
    8;


  ctx.shadowBlur=16;

  ctx.shadowColor=
    "#00d9ff";

  ctx.fillStyle=
    "#00cfff";


  ctx.fillRect(
    x,
    note.y,
    width,
    NOTE_HEIGHT
  );


  ctx.shadowBlur=0;


  ctx.fillStyle=
    "rgba(255,255,255,.85)";


  ctx.fillRect(
    x+3,
    note.y+2,
    width-6,
    4
  );


  ctx.strokeStyle="#fff";

  ctx.lineWidth=1;


  ctx.strokeRect(
    x,
    note.y,
    width,
    NOTE_HEIGHT
  );

}


/* =====================================================
   PERFECT EFFECT
===================================================== */

function createPerfectEffect(note){

  const laneWidth=
    W/LANES;


  const x=
    note.lane*
    laneWidth+
    laneWidth/2;


  effects.push({

    x:x,

    y:hitLineY,

    start:
      performance.now(),

    duration:420,

    radius:
      laneWidth*.8,

    particles:
      createParticles(
        x,
        hitLineY
      )

  });

}


/* =====================================================
   PARTICLES
===================================================== */

function createParticles(x,y){

  const particles=[];


  for(
    let i=0;
    i<22;
    i++
  ){

    const angle=
      Math.random()*
      Math.PI*2;


    const speed=
      35+
      Math.random()*120;


    particles.push({

      x:x,

      y:y,

      vx:
        Math.cos(angle)*
        speed,

      vy:
        Math.sin(angle)*
        speed,

      size:
        2+
        Math.random()*4

    });

  }


  return particles;

}


/* =====================================================
   EFFECT UPDATE
===================================================== */

function updateAndDrawEffects(){

  const now=
    performance.now();


  for(
    let i=effects.length-1;
    i>=0;
    i--
  ){

    const effect=
      effects[i];


    const age=
      now-
      effect.start;


    const progress=
      Math.min(
        1,
        age/
        effect.duration
      );


    if(
      progress>=1
    ){

      effects.splice(
        i,
        1
      );

      continue;

    }


    const alpha=
      1-progress;


    ctx.save();


    ctx.globalAlpha=alpha;


    ctx.strokeStyle=
      "#ffe600";

    ctx.lineWidth=5;

    ctx.shadowBlur=25;

    ctx.shadowColor=
      "#ffe600";


    ctx.beginPath();

    ctx.arc(

      effect.x,

      effect.y,

      effect.radius*
      (
        .25+
        .75*
        progress
      ),

      0,
      Math.PI*2

    );

    ctx.stroke();


    ctx.globalAlpha=
      alpha*.35;

    ctx.fillStyle="#fff";


    ctx.beginPath();

    ctx.arc(

      effect.x,

      effect.y,

      effect.radius*.35,

      0,
      Math.PI*2

    );

    ctx.fill();


    ctx.globalAlpha=alpha;


    const t=
      age/1000;


    for(
      const p of
      effect.particles
    ){

      const px=
        p.x+
        p.vx*t;


      const py=
        p.y+
        p.vy*t+
        45*t*t;


      ctx.fillStyle=
        "#ffe600";


      ctx.beginPath();

      ctx.arc(

        px,
        py,

        p.size*
        (
          1-progress
        ),

        0,
        Math.PI*2

      );

      ctx.fill();

    }


    ctx.restore();

  }

}


/* =====================================================
   KEY MAP
===================================================== */

const keyMap={

  "1":0,
  "2":1,
  "3":2,
  "4":3,
  "5":4,
  "6":5,
  "7":6,
  "8":7,
  "9":8,
  "0":9

};


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
"keydown",
e=>{

  if(
    !playing||
    countingDown||
    autoPlay||
    e.repeat
  ){

    return;

  }


  const lane=
    keyMap[e.key];


  if(
    lane===undefined
  ){

    return;

  }


  e.preventDefault();


  pressLane(lane);

});


/* =====================================================
   PRESS
===================================================== */

function pressLane(lane){

  flashLane(lane);


  const elapsed=
    (
      performance.now()-
      gameClockStart
    )/1000;


  let target=null;

  let best=Infinity;


  for(
    const note of notes
  ){

    if(
      note.judged||
      note.lane!==lane
    ){

      continue;

    }


    const diff=
      Math.abs(
        elapsed-
        note.time
      );


    if(
      diff<best
    ){

      best=diff;

      target=note;

    }

  }


  if(!target)
    return;


  if(
    best<=PERFECT_WINDOW
  ){

    judgeNote(
      target,
      "PERFECT"
    );

  }

  else if(
    best<=GREAT_WINDOW
  ){

    judgeNote(
      target,
      "GREAT"
    );

  }

  else if(
    best<=GOOD_WINDOW
  ){

    judgeNote(
      target,
      "GOOD"
    );

  }

}


/* =====================================================
   JUDGE
===================================================== */

function judgeNote(
  note,
  judgement
){

  if(note.judged)
    return;


  /*
    ★ 即消去
  */

  note.judged=true;


  if(
    judgement==="PERFECT"
  ){

    createPerfectEffect(
      note
    );

    perfectKeyFlash(
      note.lane
    );

  }


  switch(
    judgement
  ){

    case "PERFECT":

      score+=1000;

      combo++;

      perfectCount++;

      break;


    case "GREAT":

      score+=700;

      combo++;

      greatCount++;

      break;


    case "GOOD":

      score+=300;

      combo++;

      goodCount++;

      break;


    case "MISS":

      combo=0;

      missCount++;

      break;

  }


  maxCombo=
    Math.max(
      maxCombo,
      combo
    );


  showJudgement(
    judgement
  );


  if(
    combo>=2
  ){

    showCombo(combo);

  }


  updateScore();

}


/* =====================================================
   JUDGEMENT
===================================================== */

function showJudgement(text){

  const el=
    document.getElementById(
      "judgement"
    );


  el.textContent=text;


  if(text==="PERFECT"){

    el.style.color="#ffe600";

  }
  else if(text==="GREAT"){

    el.style.color="#40bfff";

  }
  else if(text==="GOOD"){

    el.style.color="#55ff77";

  }
  else{

    el.style.color="#ff4050";

  }


  el.classList.remove(
    "show"
  );


  void el.offsetWidth;


  el.classList.add(
    "show"
  );

}


/* =====================================================
   COMBO
===================================================== */

function showCombo(value){

  const el=
    document.getElementById(
      "comboDisplay"
    );


  el.textContent=
    `${value} COMBO`;


  el.classList.remove(
    "show"
  );


  void el.offsetWidth;


  el.classList.add(
    "show"
  );

}


/* =====================================================
   LANE FLASH
===================================================== */

function flashLane(lane){

  const buttons=
    document.querySelectorAll(
      ".laneButton"
    );


  const button=
    buttons[lane];


  if(!button)
    return;


  button.classList.add(
    "active"
  );


  setTimeout(
    ()=>{
      button.classList.remove(
        "active"
      );
    },
    100
  );

}


/* =====================================================
   PERFECT FLASH
===================================================== */

function perfectKeyFlash(lane){

  const buttons=
    document.querySelectorAll(
      ".laneButton"
    );


  const button=
    buttons[lane];


  if(!button)
    return;


  button.classList.remove(
    "perfect"
  );


  void button.offsetWidth;


  button.classList.add(
    "perfect"
  );


  setTimeout(
    ()=>{
      button.classList.remove(
        "perfect"
      );
    },
    240
  );

}


/* =====================================================
   TOUCH / MOUSE

   pointerdownなので
   スマホ・タブレット・マウス
   全部同じ処理。
===================================================== */

document
.querySelectorAll(
  ".laneButton"
)
.forEach(
  button=>{

    button.addEventListener(
      "pointerdown",
      e=>{

        e.preventDefault();


        if(
          !playing||
          countingDown||
          autoPlay
        ){

          return;

        }


        pressLane(
          Number(
            button.dataset.lane
          )
        );

      }
    );


    button.addEventListener(
      "contextmenu",
      e=>{
        e.preventDefault();
      }
    );

  }
);


/* =====================================================
   SCORE
===================================================== */

function updateScore(){

  document
  .getElementById("score")
  .textContent=
    score.toLocaleString();


  document
  .getElementById("combo")
  .textContent=
    combo;


  document
  .getElementById("maxCombo")
  .textContent=
    maxCombo;


  document
  .getElementById("perfect")
  .textContent=
    perfectCount;


  document
  .getElementById("great")
  .textContent=
    greatCount;


  document
  .getElementById("good")
  .textContent=
    goodCount;


  document
  .getElementById("miss")
  .textContent=
    missCount;

}


/* =====================================================
   FULL COMBO EFFECT
===================================================== */

function showFullComboEffect(
  perfect
){

  const effect=
    document.getElementById(
      "fullComboEffect"
    );


  const title=
    effect.querySelector(
      ".fcTitle"
    );


  const sub=
    effect.querySelector(
      ".fcSub"
    );


  if(perfect){

    title.textContent=
      "PERFECT FULL COMBO";

    sub.textContent=
      "ALL PERFECT";

  }
  else{

    title.textContent=
      "FULL COMBO";

    sub.textContent=
      "NO MISS";

  }


  effect.classList.remove(
    "show"
  );


  void effect.offsetWidth;


  effect.classList.add(
    "show"
  );


  const buttons=
    document.querySelectorAll(
      ".laneButton"
    );


  buttons.forEach(
    (button,index)=>{

      setTimeout(
        ()=>{

          button.classList.add(
            "perfect"
          );


          setTimeout(
            ()=>{

              button.classList.remove(
                "perfect"
              );

            },
            350
          );

        },
        index*45
      );

    }
  );


  setTimeout(
    ()=>{

      effect.classList.remove(
        "show"
      );

    },
    3200
  );

}


/* =====================================================
   FINISH
===================================================== */

function finishGame(){

  playing=false;

  countingDown=false;


  stopMusic();


  document
  .getElementById(
    "startBtn"
  )
  .disabled=false;


  const total=
    perfectCount+
    greatCount+
    goodCount+
    missCount;


  const result=
    document.getElementById(
      "result"
    );


  if(
    total>0&&
    missCount===0&&
    perfectCount===total
  ){

    result.textContent=
      "🏆 PERFECT FULL COMBO！";


    showFullComboEffect(
      true
    );

  }

  else if(
    total>0&&
    missCount===0
  ){

    result.textContent=
      "🎉 FULL COMBO！";


    showFullComboEffect(
      false
    );

  }

  else{

    result.textContent=
      `CLEAR　最大 ${maxCombo} COMBO`;

  }

}


/* =====================================================
   初期化
===================================================== */

resizeCanvas();

updateScore();

</script>
